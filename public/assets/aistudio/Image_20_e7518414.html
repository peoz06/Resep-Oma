</div>

<button aria-label="Tampilkan sandi" class="absolute right-3.5 w-8 h-8 rounded-full flex items-center justify-center text-secondary active:scale-90 transition-transform" onclick="togglePasswordVisibility('password', this)" type="button">

</div>
</div>

</span>
</label>
<button class="mt-2 w-full py-4 rounded-full bg-primary text-on-primary font-headline-sm text-headline-sm shadow-md active:scale-95 transition-all flex items-center justify-center gap-2" type="submit">

<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>
<span class="font-label-lg text-label-lg text-on-surface">Google</span>
</button>
<button class="flex items-center justify-center gap-2.5 py-3.5 px-4 rounded-2xl bg-surface-container-low active:bg-surface-container active:scale-95 transition-all" type="button">

<path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.36c.64-.78 1.08-1.86.96-2.94-1 .04-2.14.67-2.81 1.45-.58.67-1.1 1.76-.96 2.81 1.11.09 2.18-.54 2.81-1.32"></path>

<div class="mt-space-lg text-center">

      </a>

</div>
<script>
  function togglePasswordVisibility(fieldId, btn) {
    const input = document.getElementById(fieldId);
    const icon = btn.querySelector('.material-symbols-outlined');
    if (!input || !icon) return;
    
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }
</script></main>
